<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos | Sabor da Orla</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/produtos.css">
</head>
<body>

  <!-- Barra superior -->
  <div class="topo">
    <button type="button" title="Disponível em etapas futuras">Histórico</button>
    <button type="button" title="Disponível em etapas futuras">User_Atendente</button>
  </div>

  <!-- Cabeçalho -->
  <header class="cabecalho">
    <h1><a href="index.html">Sabor da Orla</a></h1>
    <span class="data" id="data-atual"></span>
  </header>

  <!-- Barra de seção -->
  <div class="barra-secao">Produtos</div>

  <!-- Conteúdo -->
  <main class="conteudo">

    <!-- Painel esquerdo: formulário -->
    <section class="painel">
      <h2 id="titulo-form">Adicionar Produto +</h2>

      <form id="form-produto">
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" required>
        </div>

        <div class="campo">
          <label for="descricao">Descrição</label>
          <textarea id="descricao" required></textarea>
        </div>

        <div class="campo">
          <label for="preco">Preço (R$)</label>
          <input type="number" id="preco" min="0" step="0.01" required>
        </div>

        <div class="campo">
          <label for="disponivel">Disponibilidade</label>
          <select id="disponivel">
            <option value="true">Disponível</option>
            <option value="false">Indisponível</option>
          </select>
        </div>

        <div class="botoes">
          <button type="submit" class="btn-primario" id="btn-salvar">Cadastrar</button>
          <button type="button" class="btn-secundario" id="btn-cancelar" hidden>Cancelar</button>
        </div>
      </form>
    </section>

    <!-- Painel direito: lista -->
    <section class="painel">
      <h2>Produtos Cadastrados</h2>
      <div class="lista" id="lista-produtos"></div>
    </section>

  </main>

  <script src="js/comum.js"></script>
  <script src="js/modelos.js"></script>
  <script src="js/produtos.js"></script>
</body>
</html>
